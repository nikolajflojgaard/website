<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two gateways, one business world</title><style>body{margin:0;background:#f7f3ea}main{max-width:720px;margin:auto}svg{display:block;width:100%;height:auto}</style><main><svg xmlns="http://www.w3.org/2000/svg" width="720" height="1347" viewBox="0 0 720 1347" role="img" aria-labelledby="t d"><title id="t">Two gateways, one business world</title><desc id="d">Model and business calls take separate controlled routes. Only the business route reaches shared per-run simulation state.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526b62"/></marker></defs><rect width="720" height="1347" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" fill="#223831"><text x="32" y="46" font-size="29" font-weight="700">A BUSINESS WORLD, NOT A MOCK LIST</text><text x="32" y="84" font-size="23" font-weight="400">Proposed architecture · one isolated run</text><path d="M32 306 H14 V638 H32 M14 463 H32" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><path d="M14 463 H32" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="115" width="656" height="99" rx="12" fill="#eee7dc" stroke="#668477"/><text x="58" y="154" font-size="27" font-weight="700">1  Business run setup</text><text x="58" y="192" font-size="25" font-weight="400">Goal · scenario · budget · success criteria</text><path d="M360 218 V244" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="256" width="656" height="99" rx="12" fill="#e2ebe5" stroke="#668477"/><text x="58" y="295" font-size="27" font-weight="700">2  Isolated agent runtime</text><text x="58" y="333" font-size="25" font-weight="400">No production secrets or unrestricted egress</text><text x="46" y="383" font-size="21" font-weight="400">Two controlled routes below</text><rect x="32" y="397" width="656" height="133" rx="12" fill="#e4e9ee" stroke="#668477"/><text x="58" y="436" font-size="27" font-weight="700">3a  Model route → AI gateway</text><text x="58" y="474" font-size="25" font-weight="400">Allowed models · usage limits · traces</text><text x="58" y="508" font-size="25" font-weight="400">Model traffic only; no business state</text><rect x="32" y="572" width="656" height="133" rx="12" fill="#e2ebe5" stroke="#668477"/><text x="58" y="611" font-size="27" font-weight="700">3b  Business route → tool gateway</text><text x="58" y="649" font-size="25" font-weight="400">Run identity · allowlist · contract validation</text><text x="58" y="683" font-size="25" font-weight="400">Unknown calls rejected; no live fallback</text><path d="M360 709 V735" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="747" width="656" height="133" rx="12" fill="#d4e6dc" stroke="#668477"/><text x="58" y="786" font-size="27" font-weight="700">4  One logical simulation engine</text><text x="58" y="824" font-size="25" font-weight="400">Commands → rules → transitions → events</text><text x="58" y="858" font-size="25" font-weight="400">Reads → current or explicitly stale views</text><path d="M360 884 V910" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="922" width="656" height="133" rx="12" fill="#d4e6dc" stroke="#668477"/><text x="58" y="961" font-size="27" font-weight="700">5  Shared world, isolated per run</text><text x="58" y="999" font-size="25" font-weight="400">Entities · virtual clock · event queue</text><text x="58" y="1033" font-size="25" font-weight="400">Idempotency records · seed · history</text><path d="M360 1059 V1085" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="1097" width="656" height="133" rx="12" fill="#eee7dc" stroke="#668477"/><text x="58" y="1136" font-size="27" font-weight="700">6  Outcome evidence</text><text x="58" y="1174" font-size="25" font-weight="400">State changes + observations + violations</text><text x="58" y="1208" font-size="25" font-weight="400">Judge the goal, not the agent’s final prose</text><text x="32" y="1280" font-size="22" font-weight="400">3a and 3b are separate routes from the runtime.</text><text x="32" y="1315" font-size="22" font-weight="700">No production connection is part of this design.</text></g></svg></main>
