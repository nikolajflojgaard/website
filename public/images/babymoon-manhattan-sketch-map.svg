<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FBF7EF"/>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="paperNoise">
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#6F5530" flood-opacity="0.14"/>
    </filter>
    <style>
      .ink { stroke: #2D241A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thin { stroke: #2D241A; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .note { fill: #2D241A; font-family: 'Atkinson', 'Inter', Arial, sans-serif; }
      .muted { fill: #6A5A45; font-family: 'Atkinson', 'Inter', Arial, sans-serif; }
      .accent-blue { stroke: #3B82F6; }
      .accent-pink { stroke: #EC4899; }
      .accent-green { stroke: #16A34A; }
      .accent-gold { stroke: #D97706; }
      .card { fill: #FFFDF8; stroke: #2D241A; stroke-width: 4; }
      .pin { fill: #FFF7CC; stroke: #2D241A; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FBF7EF"/>
  <rect width="1600" height="900" filter="url(#paper)" opacity="0.48"/>

  <text x="86" y="102" class="note" font-size="52" font-weight="700">Babymoon in Manhattan, with kids, direct flight, and zero interest in rushing</text>
  <text x="90" y="150" class="muted" font-size="28">Walk more. Rush less. Let New York do some of the work.</text>

  <g filter="url(#softShadow)">
    <rect x="655" y="185" width="280" height="560" rx="36" class="card"/>
    <path d="M725 220C770 205 820 208 868 220" class="ink-thin accent-blue"/>
    <path d="M760 260C805 245 848 247 885 260" class="ink-thin" opacity="0.7"/>
    <path d="M785 300C835 288 875 290 905 300" class="ink-thin" opacity="0.55"/>
    <path d="M765 340C820 330 865 334 905 346" class="ink-thin" opacity="0.45"/>
    <path d="M748 386C810 375 860 380 908 392" class="ink-thin" opacity="0.35"/>
    <path d="M730 438C790 430 850 434 914 448" class="ink-thin" opacity="0.32"/>
    <path d="M720 488C790 482 850 490 916 505" class="ink-thin" opacity="0.28"/>
    <path d="M715 538C785 535 850 545 918 562" class="ink-thin" opacity="0.25"/>
    <path d="M720 598C792 598 850 612 916 630" class="ink-thin" opacity="0.22"/>
    <path d="M735 655C802 662 858 677 905 700" class="ink-thin accent-green" opacity="0.55"/>

    <rect x="700" y="240" width="175" height="115" rx="26" fill="#DDF2D7" stroke="#2D241A" stroke-width="4"/>
    <text x="727" y="292" class="note" font-size="28" font-weight="700">Central</text>
    <text x="744" y="326" class="note" font-size="28" font-weight="700">Park</text>

    <circle cx="836" cy="372" r="13" class="pin"/>
    <text x="860" y="380" class="note" font-size="20">The MET</text>

    <circle cx="790" cy="454" r="13" class="pin"/>
    <text x="812" y="462" class="note" font-size="20">Concorde Hotel</text>

    <circle cx="770" cy="505" r="13" class="pin"/>
    <text x="792" y="513" class="note" font-size="20">Grand Central</text>

    <circle cx="820" cy="538" r="13" class="pin"/>
    <text x="842" y="546" class="note" font-size="20">Chrysler Building</text>

    <circle cx="760" cy="560" r="13" class="pin"/>
    <text x="782" y="568" class="note" font-size="20">5th Avenue</text>

    <circle cx="808" cy="592" r="13" class="pin"/>
    <text x="830" y="600" class="note" font-size="20">Rockefeller Center</text>

    <circle cx="740" cy="615" r="13" class="pin"/>
    <text x="762" y="623" class="note" font-size="20">FAO Schwarz</text>

    <circle cx="785" cy="646" r="13" class="pin"/>
    <text x="807" y="654" class="note" font-size="20">Empire State</text>

    <circle cx="840" cy="680" r="13" class="pin"/>
    <text x="862" y="688" class="note" font-size="20">Times Square, briefly</text>

    <circle cx="795" cy="718" r="13" class="pin"/>
    <text x="817" y="726" class="note" font-size="20">Oculus / One World / Wall Street</text>
    <circle cx="760" cy="742" r="11" class="pin"/>
    <text x="782" y="750" class="note" font-size="18">Staten Island Ferry for Statue deck view</text>
  </g>

  <path d="M945 705C1010 718 1060 735 1115 772" class="ink accent-gold"/>
  <text x="1128" y="790" class="note" font-size="22">Brooklyn Bridge → Dumbo</text>

  <g filter="url(#softShadow)">
    <rect x="96" y="226" width="430" height="235" rx="28" class="card"/>
    <text x="130" y="280" class="note" font-size="30" font-weight="700">Direct flight rule</text>
    <text x="132" y="335" class="note" font-size="24">CPH → EWR with SAS</text>
    <text x="132" y="382" class="muted" font-size="24">Never do transfers with kids if you can avoid it.</text>
    <path d="M355 332C400 320 440 320 480 333" class="ink-thin accent-blue"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="98" y="510" width="430" height="240" rx="28" class="card"/>
    <text x="130" y="565" class="note" font-size="30" font-weight="700">Trip logic</text>
    <text x="132" y="620" class="note" font-size="24">• one big thing a day</text>
    <text x="132" y="660" class="note" font-size="24">• explore mostly on foot</text>
    <text x="132" y="700" class="note" font-size="24">• playgrounds count as real wins</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1065" y="235" width="425" height="250" rx="28" class="card"/>
    <text x="1098" y="290" class="note" font-size="30" font-weight="700">Mood</text>
    <text x="1100" y="345" class="note" font-size="24">late spring, lots of walking,</text>
    <text x="1100" y="385" class="note" font-size="24">slow pace, and just soaking in</text>
    <text x="1100" y="425" class="note" font-size="24">that Manhattan energy</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1065" y="540" width="425" height="210" rx="28" class="card"/>
    <text x="1098" y="595" class="note" font-size="30" font-weight="700">True romance</text>
    <text x="1100" y="648" class="muted" font-size="24">Less champagne balcony.</text>
    <text x="1100" y="688" class="muted" font-size="24">More skyline + snacks + strollers.</text>
  </g>

  <text x="88" y="838" class="muted" font-size="24">A honeymoon, but make it Manhattan, playgrounds, direct flights, and zero interest in rushing.</text>
</svg>
