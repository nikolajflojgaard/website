<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FBF7EF"/>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="paperNoise">
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7C5C2B" flood-opacity="0.12"/>
    </filter>
    <style>
      .ink { stroke: #2D241A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thin { stroke: #2D241A; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .note { fill: #2D241A; font-family: 'Atkinson', 'Inter', Arial, sans-serif; }
      .muted { fill: #6A5A45; font-family: 'Atkinson', 'Inter', Arial, sans-serif; }
      .accent-blue { stroke: #3B82F6; }
      .accent-purple { stroke: #8B5CF6; }
      .accent-green { stroke: #16A34A; }
      .highlight { fill: #FFF7CC; stroke: #2D241A; stroke-width: 4; }
      .card { fill: #FFFDF8; stroke: #2D241A; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FBF7EF"/>
  <rect width="1600" height="900" filter="url(#paper)" opacity="0.5"/>

  <text x="88" y="110" class="note" font-size="54" font-weight="700">Home Brief, but sketched like the system idea actually started on paper</text>
  <text x="90" y="158" class="muted" font-size="28">Generate once. Publish once. Render everywhere.</text>

  <path d="M90 185C185 176 280 178 375 186" class="ink-thin accent-blue" opacity="0.75"/>

  <g filter="url(#softShadow)">
    <rect x="95" y="245" width="360" height="470" rx="26" class="card"/>
    <path d="M130 305C210 290 286 292 360 304" class="ink-thin"/>
    <text x="132" y="286" class="note" font-size="26" font-weight="700">Inputs floating around the house</text>
    <text x="135" y="360" class="note" font-size="24">• chores + assignments</text>
    <text x="135" y="415" class="note" font-size="24">• weather + occupancy</text>
    <text x="135" y="470" class="note" font-size="24">• power + solar context</text>
    <text x="135" y="525" class="note" font-size="24">• washer / appliances / signals</text>
    <text x="135" y="605" class="muted" font-size="24">This is already in Home Assistant.</text>
    <text x="135" y="645" class="muted" font-size="24">The hard part is making it readable,</text>
    <text x="135" y="680" class="muted" font-size="24">stable, and worth glancing at.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="560" y="205" width="470" height="525" rx="30" class="highlight"/>
    <path d="M605 275C720 260 835 263 945 276" class="ink-thin accent-purple"/>
    <text x="605" y="257" class="note" font-size="30" font-weight="700">Home Brief</text>

    <rect x="620" y="315" width="350" height="72" rx="18" class="card"/>
    <text x="650" y="360" class="note" font-size="24">generate → publish → store</text>

    <rect x="620" y="430" width="350" height="220" rx="24" class="card"/>
    <text x="650" y="475" class="note" font-size="27" font-weight="700">Today</text>
    <text x="650" y="525" class="note" font-size="22">Power is expensive right now.</text>
    <text x="650" y="565" class="note" font-size="22">Solar surplus later is likely.</text>
    <text x="650" y="605" class="note" font-size="22">3 chores need attention.</text>
    <text x="650" y="640" class="muted" font-size="20">2 of them are Nikolaj’s.</text>

    <path d="M995 345C1030 340 1054 340 1087 346" class="ink-thin accent-green"/>
    <text x="625" y="690" class="muted" font-size="22">The summary becomes a stable object, not a fleeting answer.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1120" y="245" width="390" height="470" rx="26" class="card"/>
    <path d="M1160 305C1245 290 1325 292 1405 304" class="ink-thin"/>
    <text x="1160" y="286" class="note" font-size="26" font-weight="700">Where it shows up</text>
    <text x="1160" y="360" class="note" font-size="24">• Lovelace card</text>
    <text x="1160" y="415" class="note" font-size="24">• summary sensor</text>
    <text x="1160" y="470" class="note" font-size="24">• insight count sensor</text>
    <text x="1160" y="525" class="note" font-size="24">• service endpoints</text>
    <text x="1160" y="605" class="muted" font-size="24">Same brief, multiple surfaces.</text>
    <text x="1160" y="640" class="muted" font-size="24">Less recompute, less drift,</text>
    <text x="1160" y="675" class="muted" font-size="24">less AI demo nonsense.</text>
  </g>

  <path d="M455 480C500 455 520 445 560 440" class="ink accent-blue"/>
  <path d="M1030 480C1070 472 1090 468 1120 470" class="ink accent-green"/>

  <path d="M480 745C700 780 930 782 1165 748" class="ink-thin accent-purple" opacity="0.55"/>
  <text x="90" y="825" class="muted" font-size="25">The point is not “AI wrote a summary.” The point is the summary became part of the product.</text>
</svg>
