<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#0B1020"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="90" y="110" fill="white" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">Home Brief makes the morning summary a real product surface.</text>
  <text x="90" y="160" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="28">Generate once, publish once, render consistently across the house.</text>

  <rect x="110" y="245" width="420" height="430" rx="28" fill="#111827" stroke="#334155" filter="url(#shadow)"/>
  <text x="150" y="305" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Inputs</text>
  <text x="150" y="360" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Home state signals</text>
  <text x="150" y="415" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">• chores and assignments</text>
  <text x="150" y="460" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">• weather and occupancy</text>
  <text x="150" y="505" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">• solar and energy context</text>
  <text x="150" y="550" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">• appliance and house status</text>
  <text x="150" y="610" fill="#F9A8D4" font-family="Inter, Arial, sans-serif" font-size="22">Real context, not generic AI filler</text>

  <rect x="590" y="190" width="430" height="540" rx="32" fill="#0F172A" stroke="#475569" filter="url(#shadow)"/>
  <text x="635" y="255" fill="#67E8F9" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Home Brief</text>
  <text x="635" y="315" fill="white" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Published morning brief</text>
  <rect x="635" y="355" width="340" height="60" rx="18" fill="#111827" stroke="#334155"/>
  <text x="665" y="393" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">generate → publish → store</text>
  <rect x="635" y="445" width="340" height="210" rx="22" fill="#111827" stroke="#334155"/>
  <text x="665" y="490" fill="white" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Today</text>
  <text x="665" y="535" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">Power is expensive right now.</text>
  <text x="665" y="575" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">Solar surplus is expected later.</text>
  <text x="665" y="615" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">3 chores need attention, 2 for Nikolaj.</text>

  <rect x="1080" y="245" width="410" height="430" rx="28" fill="#111827" stroke="#334155" filter="url(#shadow)"/>
  <text x="1120" y="305" fill="#C4B5FD" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Outputs</text>
  <text x="1120" y="360" fill="white" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Stable surfaces</text>
  <text x="1120" y="415" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">• Lovelace card</text>
  <text x="1120" y="460" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">• summary sensor</text>
  <text x="1120" y="505" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">• insight count sensor</text>
  <text x="1120" y="550" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">• service endpoints</text>
  <text x="1120" y="610" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="22">Consistent output instead of one-shot chat text</text>

  <path d="M540 460H570" stroke="url(#cyan)" stroke-width="10" stroke-linecap="round"/>
  <path d="M1035 460H1060" stroke="url(#violet)" stroke-width="10" stroke-linecap="round"/>

  <text x="90" y="820" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="24">The point is not that AI can write a summary. The point is that the summary becomes a dependable part of the home system.</text>
</svg>
