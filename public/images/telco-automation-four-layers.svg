<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Four layer map of telco service automation</title>
  <desc id="desc">A restrained systems diagram showing commercial order, service order, activation, assurance, incidents, events, and telemetry across four architecture layers.</desc>
  <rect width="1400" height="760" fill="#f7f5f0"/>
  <rect x="64" y="58" width="1272" height="644" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="96" y="116" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Telco automation is a chain, not an API catalog</text>
  <text x="96" y="154" fill="#4b5563" font-family="Inter, Arial, sans-serif" font-size="18">The architect job is to make ownership, state, and failure visible across the whole flow.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="16">
    <rect x="96" y="202" width="1208" height="92" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="122" y="235" fill="#312e81" font-weight="700">Business APIs</text>
    <text x="122" y="266" fill="#4338ca">quote</text>
    <text x="292" y="266" fill="#4338ca">customer</text>
    <text x="492" y="266" fill="#4338ca">commercial order</text>
    <text x="752" y="266" fill="#4338ca">partner handoff</text>
    <text x="1042" y="266" fill="#4338ca">trouble ticket</text>

    <rect x="96" y="318" width="1208" height="92" rx="12" fill="#ecfdf5" stroke="#059669"/>
    <text x="122" y="351" fill="#064e3b" font-weight="700">Service and resource APIs</text>
    <text x="122" y="382" fill="#047857">qualification</text>
    <text x="342" y="382" fill="#047857">service order</text>
    <text x="582" y="382" fill="#047857">activation</text>
    <text x="802" y="382" fill="#047857">inventory</text>
    <text x="1042" y="382" fill="#047857">assurance</text>

    <rect x="96" y="434" width="1208" height="92" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="122" y="467" fill="#7c2d12" font-weight="700">Event backbone</text>
    <text x="122" y="498" fill="#c2410c">state changed</text>
    <text x="362" y="498" fill="#c2410c">order accepted</text>
    <text x="612" y="498" fill="#c2410c">service active</text>
    <text x="842" y="498" fill="#c2410c">fault raised</text>
    <text x="1082" y="498" fill="#c2410c">recovery done</text>

    <rect x="96" y="550" width="1208" height="92" rx="12" fill="#f8fafc" stroke="#64748b"/>
    <text x="122" y="583" fill="#0f172a" font-weight="700">Observability and control</text>
    <text x="122" y="614" fill="#334155">trace id</text>
    <text x="292" y="614" fill="#334155">contract version</text>
    <text x="552" y="614" fill="#334155">owner</text>
    <text x="742" y="614" fill="#334155">retry rule</text>
    <text x="972" y="614" fill="#334155">decision record</text>
  </g>

  <g fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 266 C290 292, 298 333, 342 356"/>
    <path d="M452 382 C520 412, 560 446, 612 480"/>
    <path d="M690 382 C725 422, 745 452, 842 480"/>
    <path d="M930 266 C984 306, 1012 346, 1042 382"/>
    <path d="M1084 382 C1108 424, 1114 462, 1082 498"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">
    <circle cx="238" cy="266" r="5" fill="#111827"/>
    <circle cx="342" cy="356" r="5" fill="#111827"/>
    <circle cx="612" cy="480" r="5" fill="#111827"/>
    <circle cx="842" cy="480" r="5" fill="#111827"/>
    <circle cx="1042" cy="382" r="5" fill="#111827"/>
  </g>

  <text x="96" y="682" fill="#4b5563" font-family="Inter, Arial, sans-serif" font-size="15">REST tells one system what to do. Events tell the estate what changed. Telemetry tells operations what happened.</text>
</svg>
