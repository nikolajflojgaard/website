<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#fffdf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17202a">
<path d="M65 128 C320 102 575 114 840 102" stroke="#f2d98d" stroke-width="34" opacity=".55" fill="none"/>
<text x="70" y="115" font-size="62" font-weight="700">Stop giving AI agents service accounts</text>
<text x="72" y="165" font-size="27">The identity chain I want before agents touch real enterprise systems.</text>
<rect x="75" y="240" width="230" height="145" rx="18" fill="#eef6fb" stroke="#263238" stroke-width="3"/>
<text x="115" y="290" font-size="30" font-weight="700">1. Human</text><text x="115" y="335" font-size="23">Who asked?</text>
<rect x="390" y="240" width="230" height="145" rx="18" fill="#fff3d9" stroke="#263238" stroke-width="3"/>
<text x="425" y="290" font-size="30" font-weight="700">2. Agent</text><text x="425" y="335" font-size="23">What is acting?</text>
<rect x="705" y="220" width="285" height="185" rx="18" fill="#edf5e9" stroke="#263238" stroke-width="3"/>
<text x="745" y="275" font-size="30" font-weight="700">3. Policy</text><text x="745" y="320" font-size="23">Is this action allowed</text><text x="745" y="350" font-size="23">for this user + agent?</text>
<rect x="1075" y="240" width="250" height="145" rx="18" fill="#f5ecf7" stroke="#263238" stroke-width="3"/>
<text x="1110" y="290" font-size="30" font-weight="700">4. Tool</text><text x="1110" y="335" font-size="23">Scoped access</text>
<path d="M305 312 L385 312 M620 312 L700 312 M990 312 L1070 312" stroke="#263238" stroke-width="4"/>
<path d="M375 302 L390 312 L375 322 M690 302 L705 312 L690 322 M1060 302 L1075 312 L1060 322" fill="none" stroke="#263238" stroke-width="4"/>
<rect x="80" y="490" width="610" height="275" rx="20" fill="#fff0ed" stroke="#d87a6b" stroke-width="4"/>
<text x="115" y="545" font-size="34" font-weight="700">The shortcut</text>
<text x="120" y="600" font-size="26">AI agent → svc-ai-prod → everything</text>
<text x="120" y="650" font-size="22">• shared identity</text><text x="120" y="690" font-size="22">• long-lived credentials</text><text x="120" y="730" font-size="22">• audit log loses the human + task context</text>
<rect x="780" y="490" width="740" height="275" rx="20" fill="#eef7ed" stroke="#77a86d" stroke-width="4"/>
<text x="815" y="545" font-size="34" font-weight="700">The useful chain</text>
<text x="820" y="600" font-size="24">user → agent → policy → short-lived token → tool</text>
<text x="820" y="650" font-size="22">✓ least privilege</text><text x="820" y="690" font-size="22">✓ delegated context when a human initiated the task</text><text x="820" y="730" font-size="22">✓ an audit trail that can answer who, what and why</text>
<text x="75" y="835" font-size="25" font-style="italic">The LLM can choose what might help. The platform decides what is allowed.</text>
</g></svg>