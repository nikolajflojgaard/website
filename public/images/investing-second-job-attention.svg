    <path d="M1248 630H1368V731C1368 766 1341 792 1308 792H1304C1274 792 1248 767 1248 736V630Z" fill="#F2ECE1"/>
    <path d="M1362 660C1410 657 1410 724 1362 719" stroke="#F2ECE1" stroke-width="23" stroke-linecap="round"/>
    <ellipse cx="1308" cy="630" rx="60" ry="20" fill="#6F4A33"/>
    <ellipse cx="1308" cy="626" rx="43" ry="12" fill="#8A5D3D"/>
  </g>

  <path d="M733 383C712 341 724 302 762 274" stroke="#B7A081" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  <path d="M790 386C769 344 781 305 819 277" stroke="#B7A081" stroke-width="9" stroke-linecap="round" opacity="0.42"/>

  <rect x="0" y="0" width="1600" height="900" fill="#2C241E" opacity="0.03"/>
</svg>
