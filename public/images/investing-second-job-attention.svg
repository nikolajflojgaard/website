<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A quiet desk after stepping away from market checking</title>
  <desc id="desc">A calm home office desk with a closed laptop, face-down phone, notebook, coffee cup, and soft family-life details in the background.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F1E8"/>
      <stop offset="0.58" stop-color="#EFE8DC"/>
      <stop offset="1" stop-color="#E5DED2"/>
    </linearGradient>
    <linearGradient id="desk" x1="160" y1="520" x2="1440" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D5B28A"/>
      <stop offset="1" stop-color="#B98658"/>
    </linearGradient>
    <linearGradient id="laptop" x1="482" y1="462" x2="1048" y2="665" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F3437"/>
      <stop offset="1" stop-color="#111516"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(347 190) rotate(40) scale(620 420)">
      <stop stop-color="#FFF9ED" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF9ED" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#5A4631" flood-opacity="0.2"/>
    </filter>
    <filter id="blurBack" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#light)"/>

  <g filter="url(#blurBack)" opacity="0.58">
    <rect x="1115" y="144" width="210" height="262" rx="6" fill="#F8F5EE" stroke="#D0C3B4" stroke-width="8"/>
    <path d="M1152 252C1185 220 1216 223 1248 266C1260 282 1278 294 1291 285" stroke="#D97847" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1190" cy="205" r="28" fill="#F1C35D"/>
    <path d="M1155 333L1211 286L1261 337L1295 306" stroke="#71956C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="255" y="118" width="280" height="330" rx="6" fill="#F6F1E8" stroke="#CDBFAF" stroke-width="8"/>
    <path d="M306 367C348 319 382 330 419 371C444 399 477 395 501 362" stroke="#5E8AA8" stroke-width="11" stroke-linecap="round"/>
    <circle cx="452" cy="182" r="34" fill="#E7A658"/>
  </g>

  <rect x="105" y="512" width="1390" height="334" rx="34" fill="url(#desk)"/>
  <path d="M142 568C384 601 711 609 1044 584C1198 573 1340 551 1461 523" stroke="#C99D70" stroke-width="18" stroke-linecap="round" opacity="0.35"/>
  <path d="M191 730C500 690 790 701 1052 744C1196 768 1319 770 1431 750" stroke="#8E623D" stroke-width="10" stroke-linecap="round" opacity="0.22"/>

  <g filter="url(#softShadow)">
    <path d="M491 459H1022C1043 459 1060 476 1060 497V629H453V497C453 476 470 459 491 459Z" fill="url(#laptop)"/>
    <rect x="428" y="626" width="656" height="46" rx="13" fill="#171B1D"/>
    <path d="M690 626H823L806 646H707L690 626Z" fill="#343A3D"/>
    <rect x="493" y="491" width="525" height="100" rx="12" fill="#252B2E"/>
    <path d="M523 561H771" stroke="#394246" stroke-width="12" stroke-linecap="round" opacity="0.42"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1113" y="586" width="154" height="242" rx="24" transform="rotate(-9 1113 586)" fill="#111517"/>
    <rect x="1132" y="607" width="117" height="197" rx="17" transform="rotate(-9 1132 607)" fill="#202629"/>
    <circle cx="1179" cy="793" r="9" fill="#101315"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="238" y="596" width="285" height="194" rx="18" transform="rotate(5 238 596)" fill="#F4EFE5"/>
    <path d="M287 637L463 652" stroke="#DACBBB" stroke-width="8" stroke-linecap="round"/>
    <path d="M283 675L466 691" stroke="#DACBBB" stroke-width="8" stroke-linecap="round"/>
    <path d="M280 713L396 723" stroke="#DACBBB" stroke-width="8" stroke-linecap="round"/>
    <path d="M438 617L470 817" stroke="#C1A98E" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g filter="url(#softShadow)">
