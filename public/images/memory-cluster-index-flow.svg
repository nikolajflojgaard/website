<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Memory retrieval flow</title>
  <desc id="desc">Agent retrieval flow from memory map to topic summaries, local index, and targeted daily-note evidence.</desc>
  <rect width="1600" height="900" fill="#fbfbf8"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="105" y="110" fill="#111827" font-size="52" font-weight="850">The new recall path</text>
    <text x="108" y="158" fill="#52606d" font-size="25">Start narrow. Expand only when the answer needs evidence.</text>

    <g fill="#ffffff" stroke-width="3">
      <rect x="110" y="255" width="245" height="122" rx="18" stroke="#0ea5e9"/>
      <rect x="430" y="255" width="285" height="122" rx="18" stroke="#22c55e"/>
      <rect x="790" y="255" width="260" height="122" rx="18" stroke="#f97316"/>
      <rect x="1125" y="255" width="305" height="122" rx="18" stroke="#8b5cf6"/>
    </g>

    <text x="145" y="306" fill="#075985" font-size="25" font-weight="800">1. MAP.md</text>
    <text x="145" y="340" fill="#475569" font-size="19">topic and alias routing</text>

    <text x="465" y="306" fill="#166534" font-size="25" font-weight="800">2. Topic summary</text>
    <text x="465" y="340" fill="#475569" font-size="19">current state first</text>

    <text x="825" y="306" fill="#9a3412" font-size="25" font-weight="800">3. Local index</text>
    <text x="825" y="340" fill="#475569" font-size="19">chunked SQLite FTS</text>

    <text x="1160" y="306" fill="#5b21b6" font-size="25" font-weight="800">4. Daily evidence</text>
    <text x="1160" y="340" fill="#475569" font-size="19">targeted source excerpts</text>

    <path d="M355 316h75" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M715 316h75" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M1050 316h75" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(155 520)">
      <rect width="360" height="175" rx="20" fill="#f1f5f9"/>
      <text x="32" y="55" fill="#111827" font-size="26" font-weight="850">Old fallback</text>
      <text x="32" y="96" fill="#475569" font-size="22">2,281 line entries</text>
      <text x="32" y="132" fill="#475569" font-size="22">flat search, noisy reads</text>
    </g>

    <g transform="translate(620 520)">
      <rect width="360" height="175" rx="20" fill="#ecfdf5"/>
      <text x="32" y="55" fill="#064e3b" font-size="26" font-weight="850">New index</text>
      <text x="32" y="96" fill="#475569" font-size="22">360 coherent chunks</text>
      <text x="32" y="132" fill="#475569" font-size="22">summary-heavy results</text>
    </g>

    <g transform="translate(1085 520)">
      <rect width="360" height="175" rx="20" fill="#fefce8"/>
      <text x="32" y="55" fill="#713f12" font-size="26" font-weight="850">Practical result</text>
      <text x="32" y="96" fill="#475569" font-size="22">fewer tokens burned</text>
      <text x="32" y="132" fill="#475569" font-size="22">less rediscovery work</text>
    </g>
  </g>
</svg>

