<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Memory Cluster Index</title>
  <desc id="desc">Layered agent memory architecture with compact truth, topic summaries, daily notes, and a local search index.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".55" stop-color="#eef6f4"/>
      <stop offset="1" stop-color="#f5f0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="105" y="82" width="1390" height="736" rx="32" fill="#ffffff" filter="url(#shadow)"/>

  <text x="155" y="168" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="850">Memory Cluster Index</text>
  <text x="158" y="218" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25">A faster, cheaper memory shape for long-running personal agents.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(155 310)">
      <rect width="270" height="116" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
      <text x="28" y="48" fill="#164e63" font-size="24" font-weight="800">Truth layer</text>
      <text x="28" y="82" fill="#475569" font-size="19">MEMORY.md stays compact</text>
    </g>

    <g transform="translate(485 310)">
      <rect width="300" height="116" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
      <text x="28" y="48" fill="#14532d" font-size="24" font-weight="800">Fast recall layer</text>
      <text x="28" y="82" fill="#475569" font-size="19">topic summaries own context</text>
    </g>

    <g transform="translate(845 310)">
      <rect width="270" height="116" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
      <text x="28" y="48" fill="#7c2d12" font-size="24" font-weight="800">Raw log layer</text>
      <text x="28" y="82" fill="#475569" font-size="19">daily notes keep evidence</text>
    </g>

    <g transform="translate(1175 310)">
      <rect width="270" height="116" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
      <text x="28" y="48" fill="#4c1d95" font-size="24" font-weight="800">Index layer</text>
      <text x="28" y="82" fill="#475569" font-size="19">SQLite FTS over chunks</text>
    </g>

    <path d="M425 368h60" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M785 368h60" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M1115 368h60" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(180 545)">
      <text x="0" y="0" fill="#0f172a" font-size="32" font-weight="850">Benchmark from the migration</text>
      <text x="0" y="48" fill="#334155" font-size="24">59.7k tokens → 1.1k tokens on a normal one-topic route</text>
      <text x="0" y="88" fill="#334155" font-size="24">3.10 ms line search → 0.16 ms SQLite FTS engine search</text>
      <text x="0" y="128" fill="#334155" font-size="24">8 / 8 topic smoke tests returned the right summary first</text>
    </g>

    <g transform="translate(1040 545)">
      <rect width="360" height="155" rx="22" fill="#0f172a"/>
      <text x="36" y="56" fill="#ffffff" font-size="28" font-weight="850">98.1%</text>
      <text x="36" y="94" fill="#cbd5e1" font-size="21">less context than reading</text>
      <text x="36" y="124" fill="#cbd5e1" font-size="21">the full memory archive</text>
    </g>
  </g>
</svg>

