<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MCP enterprise control plane</title>
  <desc id="desc">Architecture-style diagram showing an Agent Gateway, LLM Gateway, policy layer, MCP servers, and enterprise systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172033"/>
      <stop offset="1" stop-color="#0f3b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.18" stroke="#d1d5db" stroke-width="1">
    <path d="M0 120H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 360H1200"/>
    <path d="M0 480H1200"/>
    <path d="M200 0V630"/>
    <path d="M400 0V630"/>
    <path d="M600 0V630"/>
    <path d="M800 0V630"/>
    <path d="M1000 0V630"/>
  </g>

  <text x="72" y="92" fill="#f9fafb" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">MCP needs an enterprise control plane</text>
  <text x="74" y="137" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">Identity, policy, audit, model routing, and governed domain tools.</text>

  <g filter="url(#shadow)">
    <rect x="86" y="238" width="190" height="86" rx="8" fill="#f8fafc"/>
    <text x="181" y="272" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Employee</text>
    <text x="181" y="302" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">request + context</text>

    <rect x="356" y="218" width="214" height="126" rx="8" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <text x="463" y="263" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Agent</text>
    <text x="463" y="292" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Gateway</text>
    <text x="463" y="320" text-anchor="middle" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="15">orchestration + tool policy</text>

    <rect x="665" y="146" width="206" height="86" rx="8" fill="#e0f2fe"/>
    <text x="768" y="181" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">LLM Gateway</text>
    <text x="768" y="208" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">models, cost, retention</text>

    <rect x="665" y="272" width="206" height="86" rx="8" fill="#dcfce7"/>
    <text x="768" y="307" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Policy Engine</text>
    <text x="768" y="334" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">scopes, consent, step-up</text>

    <rect x="665" y="398" width="206" height="86" rx="8" fill="#fef3c7"/>
    <text x="768" y="433" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Audit Trail</text>
    <text x="768" y="460" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">trace every action</text>

    <rect x="946" y="132" width="180" height="70" rx="8" fill="#f8fafc"/>
    <text x="1036" y="160" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Assurance MCP</text>
    <text x="1036" y="184" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">diagnostics</text>

    <rect x="946" y="246" width="180" height="70" rx="8" fill="#f8fafc"/>
    <text x="1036" y="274" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Order MCP</text>
    <text x="1036" y="298" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">fulfillment</text>

    <rect x="946" y="360" width="180" height="70" rx="8" fill="#f8fafc"/>
    <text x="1036" y="388" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Incident MCP</text>
    <text x="1036" y="412" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">case handling</text>
  </g>

  <g fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 281H348"/>
    <path d="M570 250C610 232 624 198 657 190"/>
    <path d="M570 293H657"/>
    <path d="M570 328C610 356 624 419 657 438"/>
    <path d="M871 189H936"/>
    <path d="M871 315C900 307 912 292 936 281"/>
    <path d="M871 441C902 432 914 407 936 395"/>
  </g>

  <g fill="#38bdf8">
    <circle cx="348" cy="281" r="5"/>
    <circle cx="657" cy="190" r="5"/>
    <circle cx="657" cy="293" r="5"/>
    <circle cx="657" cy="438" r="5"/>
    <circle cx="936" cy="189" r="5"/>
    <circle cx="936" cy="281" r="5"/>
    <circle cx="936" cy="395" r="5"/>
  </g>

  <rect x="72" y="536" width="1056" height="1" fill="#e5e7eb" opacity="0.28"/>
  <text x="72" y="577" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19">The protocol exposes tools. The gateway makes them governable.</text>
</svg>
