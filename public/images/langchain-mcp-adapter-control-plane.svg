<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LangChain MCP adapter control plane</title>
  <desc id="desc">A diagram-style illustration showing LangChain and FastMCP connecting agents to governed MCP servers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#17324d"/>
      <stop offset="1" stop-color="#263238"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#c6f6d5" stroke-width="1">
    <path d="M80 120h1040M80 210h1040M80 300h1040M80 390h1040M80 480h1040"/>
    <path d="M180 80v470M360 80v470M540 80v470M720 80v470M900 80v470M1080 80v470"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="84" y="210" width="240" height="170" rx="18" fill="#f8fafc"/>
    <text x="132" y="274" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="700">Agent</text>
    <text x="132" y="316" fill="#475569" font-family="Arial, sans-serif" font-size="22">LangGraph run</text>
    <text x="132" y="348" fill="#475569" font-family="Arial, sans-serif" font-size="22">tool calls</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="170" width="320" height="250" rx="22" fill="#d9f99d"/>
    <text x="490" y="252" fill="#14532d" font-family="Arial, sans-serif" font-size="44" font-weight="700">langchain.mcp</text>
    <text x="490" y="304" fill="#365314" font-family="Arial, sans-serif" font-size="25">MCPAdapter</text>
    <text x="490" y="342" fill="#365314" font-family="Arial, sans-serif" font-size="25">tools, interrupts, metadata</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="876" y="118" width="240" height="120" rx="18" fill="#e0f2fe"/>
    <text x="924" y="170" fill="#075985" font-family="Arial, sans-serif" font-size="30" font-weight="700">FastMCP</text>
    <text x="924" y="204" fill="#0f766e" font-family="Arial, sans-serif" font-size="20">transport + auth</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="876" y="292" width="240" height="120" rx="18" fill="#fef3c7"/>
    <text x="924" y="344" fill="#78350f" font-family="Arial, sans-serif" font-size="30" font-weight="700">MCP servers</text>
    <text x="924" y="378" fill="#92400e" font-family="Arial, sans-serif" font-size="20">domain tools</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="876" y="466" width="240" height="78" rx="18" fill="#fee2e2"/>
    <text x="924" y="515" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="25" font-weight="700">Policy + audit</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="8">
    <path d="M324 295h96" stroke="#86efac"/>
    <path d="M760 250c58-52 88-74 116-72" stroke="#7dd3fc"/>
    <path d="M760 315h116" stroke="#fbbf24"/>
    <path d="M760 376c60 72 84 118 116 128" stroke="#fca5a5"/>
  </g>
  <g fill="#86efac">
    <path d="M416 295l-20-13v26z"/>
  </g>
  <g fill="#7dd3fc">
    <path d="M872 180l-23-6 12 21z"/>
  </g>
  <g fill="#fbbf24">
    <path d="M872 315l-20-13v26z"/>
  </g>
  <g fill="#fca5a5">
    <path d="M872 503l-23-6 12 21z"/>
  </g>
  <text x="84" y="92" fill="#f8fafc" font-family="Arial, sans-serif" font-size="44" font-weight="700">MCP is becoming ordinary infrastructure</text>
  <text x="84" y="556" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24">Less adapter code. Same need for ownership, identity, policy, and traceability.</text>
</svg>
