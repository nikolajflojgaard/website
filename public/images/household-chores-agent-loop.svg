<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#0B1020"/>
  <defs>
    <linearGradient id="g1" x1="180" y1="120" x2="1420" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="g2" x1="300" y1="220" x2="1300" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="1260" cy="170" r="220" fill="#1D4ED8" fill-opacity="0.18"/>
  <circle cx="250" cy="760" r="260" fill="#7C3AED" fill-opacity="0.14"/>

  <text x="120" y="130" fill="white" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">
    Household Chores as an agentic interface
  </text>
  <text x="120" y="185" fill="#A5B4FC" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">
    Home Assistant + chat + task actions that actually get used
  </text>

  <g filter="url(#shadow)">
    <rect x="120" y="250" rx="28" ry="28" width="320" height="250" fill="url(#g2)" stroke="#374151"/>
    <text x="160" y="315" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Chat surfaces</text>
    <text x="160" y="365" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="26">iMessage</text>
    <text x="160" y="405" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="26">Telegram</text>
    <text x="160" y="445" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="26">Other routed chats</text>
    <text x="160" y="490" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="22">“Add Workout on Wednesday”</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="190" rx="32" ry="32" width="320" height="320" fill="url(#g1)"/>
    <text x="700" y="285" fill="white" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Jason</text>
    <text x="700" y="332" fill="#E0F2FE" font-family="Inter, Arial, sans-serif" font-size="26">interprets intent</text>
    <text x="700" y="370" fill="#E0F2FE" font-family="Inter, Arial, sans-serif" font-size="26">calls HA actions</text>
    <text x="700" y="408" fill="#E0F2FE" font-family="Inter, Arial, sans-serif" font-size="26">returns the result</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="250" rx="28" ry="28" width="360" height="250" fill="url(#g2)" stroke="#374151"/>
    <text x="1120" y="315" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Home Assistant</text>
    <text x="1120" y="365" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="24">create_task</text>
    <text x="1120" y="401" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="24">update_task</text>
    <text x="1120" y="437" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="24">delete_task</text>
    <text x="1120" y="473" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="24">list_tasks</text>
  </g>

  <g opacity="0.9">
    <path d="M440 375C520 375 560 350 640 350" stroke="#60A5FA" stroke-width="10" stroke-linecap="round"/>
    <path d="M960 350C1020 350 1040 375 1080 375" stroke="#22D3EE" stroke-width="10" stroke-linecap="round"/>
    <polygon points="625,335 660,350 625,365" fill="#60A5FA"/>
    <polygon points="1065,360 1100,375 1065,390" fill="#22D3EE"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="280" y="610" rx="28" ry="28" width="1040" height="170" fill="#0F172A" stroke="#334155"/>
    <text x="330" y="675" fill="#F9FAFB" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">One source of truth. Multiple useful interfaces.</text>
    <text x="330" y="725" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="26">Dashboard card • per-person sensors • morning brief • chat-based task capture</text>
  </g>
</svg>