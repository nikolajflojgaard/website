<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#0F172A"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <text x="90" y="110" fill="white" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">A personal assistant on your machine changes the interface.</text>
  <text x="90" y="160" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="28">You stop opening apps and start delegating work.</text>

  <rect x="120" y="270" width="250" height="120" rx="24" fill="#1E293B" stroke="#334155" filter="url(#s)"/>
  <text x="165" y="340" fill="white" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">You</text>
  <text x="155" y="375" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">intent, goals, context</text>

  <rect x="500" y="220" width="600" height="220" rx="30" fill="#111827" stroke="#475569" filter="url(#s)"/>
  <text x="560" y="295" fill="#67E8F9" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Agentic personal assistant</text>
  <text x="560" y="350" fill="white" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Plans, decides, calls tools, keeps working</text>
  <text x="560" y="395" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">Understands intent → uses apps, APIs, files, browser, calendar, email, docs</text>

  <rect x="1230" y="270" width="250" height="120" rx="24" fill="#1E293B" stroke="#334155" filter="url(#s)"/>
  <text x="1265" y="340" fill="white" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Outcome</text>
  <text x="1255" y="375" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">done, not drafted</text>

  <rect x="300" y="560" width="1000" height="180" rx="30" fill="#111827" stroke="#334155" filter="url(#s)"/>
  <text x="350" y="625" fill="#A5B4FC" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Tools on your machine</text>
  <text x="350" y="680" fill="white" font-family="Inter, Arial, sans-serif" font-size="26">Browser • Files • Email • Calendar • CRM • ERP • Terminal • Docs • Tickets • Messaging</text>

  <path d="M380 330H470" stroke="#60A5FA" stroke-width="10" stroke-linecap="round"/>
  <path d="M1110 330H1200" stroke="#60A5FA" stroke-width="10" stroke-linecap="round"/>
  <path d="M800 450V535" stroke="#A78BFA" stroke-width="10" stroke-linecap="round"/>

  <text x="90" y="820" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="24">That is why this disrupts customer handling first: most service work is already tool-using coordination with rules.</text>
</svg>