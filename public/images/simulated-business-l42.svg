<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1210" viewBox="0 0 720 1210" role="img" aria-labelledby="t d"><title id="t">L42 fault and recovery timeline</title><desc id="d">A persistent cable fault survives router restart. A scheduled repair changes state, then fresh verification permits closure.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#526b62"/></marker></defs><rect width="720" height="1210" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" fill="#223831"><text x="32" y="46" font-size="28" font-weight="700">L42: THE CABLE DOES NOT HEAL ITSELF</text><text x="32" y="84" font-size="23" font-weight="400">Illustrative scenario · virtual time, not an SLA</text><rect x="32" y="115" width="656" height="133" rx="12" fill="#f0dfcf" stroke="#668477"/><text x="58" y="154" font-size="27" font-weight="700">T+00  Fault present</text><text x="58" y="192" font-size="25" font-weight="400">Truth: cable damaged; service degraded</text><text x="58" y="226" font-size="25" font-weight="400">Old cached “healthy” reading is timestamped</text><path d="M360 252 V278" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="290" width="656" height="133" rx="12" fill="#eee7dc" stroke="#668477"/><text x="58" y="329" font-size="27" font-weight="700">T+01  Diagnose, then diagnose again</text><text x="58" y="367" font-size="25" font-weight="400">Fresh readings derive from the same fault</text><text x="58" y="401" font-size="25" font-weight="400">Noise is bounded; it cannot erase the fault</text><path d="M360 427 V453" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="465" width="656" height="133" rx="12" fill="#f0dfcf" stroke="#668477"/><text x="58" y="504" font-size="27" font-weight="700">T+02  Restart router</text><text x="58" y="542" font-size="25" font-weight="400">Router restarts; cable stays damaged</text><text x="58" y="576" font-size="25" font-weight="400">After restart: fresh diagnostic still fails</text><path d="M360 602 V628" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="640" width="656" height="133" rx="12" fill="#e2ebe5" stroke="#668477"/><text x="58" y="679" font-size="27" font-weight="700">T+03  Dispatch repair</text><text x="58" y="717" font-size="25" font-weight="400">One work order; completion event scheduled</text><text x="58" y="751" font-size="25" font-weight="400">Retry with same key → same booking</text><path d="M360 777 V803" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="815" width="656" height="133" rx="12" fill="#d4e6dc" stroke="#668477"/><text x="58" y="854" font-size="27" font-weight="700">T+60  Repair event executes</text><text x="58" y="892" font-size="25" font-weight="400">Harness advances the virtual clock</text><text x="58" y="926" font-size="25" font-weight="400">Cable changes: damaged → repaired</text><path d="M360 952 V978" fill="none" stroke="#526b62" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="990" width="656" height="133" rx="12" fill="#d4e6dc" stroke="#668477"/><text x="58" y="1029" font-size="27" font-weight="700">T+61  Verify, then close</text><text x="58" y="1067" font-size="25" font-weight="400">Fresh post-repair reading confirms recovery</text><text x="58" y="1101" font-size="25" font-weight="400">Evidence permits case closure</text><text x="32" y="1169" font-size="23" font-weight="700">A booking is not a repair. A repair is not verification.</text></g></svg>