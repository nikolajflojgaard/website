<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="907" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
<title id="title">Changed action payload rejected despite earlier approval.</title><desc id="desc">Three lanes: proposal v1 is approved; v2 changes the target; execution rejects v2 with the old approval. A fresh review is required.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#333a36" stroke-width="1.5"/></marker></defs>
<rect width="900" height="680" fill="#f5f1e7"/><rect x="16" y="16" width="868" height="648" fill="none" stroke="#333a36"/>
<g fill="#333a36" font-family="Arial,sans-serif"><text x="38" y="55" font-size="20" letter-spacing="2">ENGINEERING CHANGE TICKET / 042</text><text x="38" y="106" font-size="38" font-weight="bold">The yes belongs to version 1.</text>
<path d="M38 130H862" stroke="#333a36"/>
<g text-anchor="middle" font-size="29" font-weight="bold"><text x="170" y="177">PROPOSAL</text><text x="450" y="177">APPROVAL</text><text x="730" y="177">EXECUTION</text></g>
<g stroke="#a7a89e" stroke-dasharray="4 7"><path d="M170 193V585"/><path d="M450 193V585"/><path d="M730 193V585"/></g>
<rect x="40" y="210" width="245" height="85" fill="#e6e6da" stroke="#333a36"/><text x="55" y="246" font-size="30" font-weight="bold">v1 · 1 service</text><text x="55" y="279" font-size="26">service-17</text>
<path d="M285 252H320" stroke="#333a36" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="325" y="210" width="250" height="85" fill="#dce5da" stroke="#49644d"/><text x="342" y="246" font-size="30" font-weight="bold">Approved: v1</text><text x="342" y="279" font-size="26">Exact action</text>
<rect x="40" y="334" width="245" height="85" fill="#f0dcb5" stroke="#8b6224"/><text x="55" y="370" font-size="29" font-weight="bold">v2 · 3 services</text><text x="55" y="403" font-size="26">Target changed</text>
<path d="M285 377H730V438" fill="none" stroke="#333a36" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="350" width="330" height="47" fill="#f5f1e7"/><text x="338" y="382" font-size="27">v2 + old approval</text>
<rect x="605" y="443" width="255" height="85" fill="#f0dcb5" stroke="#8b6224" stroke-width="3"/><text x="623" y="479" font-size="32" font-weight="bold">REJECTED</text><text x="623" y="512" font-size="26">No match</text>
<path d="M605 487H580" stroke="#333a36" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="443" width="250" height="85" fill="#e6e6da" stroke="#333a36"/><text x="343" y="479" font-size="30" font-weight="bold">Review v2</text><text x="343" y="512" font-size="26">Fresh approval</text>
<path d="M38 588H862" stroke="#333a36"/><text x="38" y="625" font-size="29" font-weight="bold">Approval belongs to a specific action.</text><text x="38" y="650" font-size="19">SYNTHETIC EXAMPLE · CHECK AT THE WRITE BOUNDARY</text></g></svg>
