<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#0B1020"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="110" fill="white" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">Agentic AI is not a chatbot upgrade.</text>
  <text x="90" y="160" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="28">It is software that can interpret intent, use tools, make decisions, and finish work.</text>

  <rect x="90" y="240" rx="24" ry="24" width="410" height="480" fill="#111827" stroke="#334155" filter="url(#shadow)"/>
  <text x="130" y="305" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Old workflow</text>
  <text x="130" y="355" fill="white" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Customer asks</text>
  <text x="130" y="405" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ ticket created</text>
  <text x="130" y="450" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ queue</text>
  <text x="130" y="495" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ human checks CRM</text>
  <text x="130" y="540" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ human checks policy</text>
  <text x="130" y="585" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ human takes action</text>
  <text x="130" y="630" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ human writes response</text>
  <text x="130" y="675" fill="#FCA5A5" font-family="Inter, Arial, sans-serif" font-size="22">Slow, fragmented, expensive</text>

  <rect x="590" y="240" rx="24" ry="24" width="420" height="480" fill="#0F172A" stroke="#334155" filter="url(#shadow)"/>
  <text x="630" y="305" fill="#67E8F9" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Agentic workflow</text>
  <text x="630" y="355" fill="white" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Customer asks</text>
  <text x="630" y="405" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ agent reads intent</text>
  <text x="630" y="450" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ agent checks systems</text>
  <text x="630" y="495" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ agent applies policy</text>
  <text x="630" y="540" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ agent executes allowed actions</text>
  <text x="630" y="585" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ agent documents outcome</text>
  <text x="630" y="630" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24">→ escalate only edge cases</text>
  <text x="630" y="675" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="22">Faster, cheaper, cleaner</text>

  <rect x="1090" y="240" rx="24" ry="24" width="420" height="480" fill="#111827" stroke="#334155" filter="url(#shadow)"/>
  <text x="1130" y="305" fill="#C4B5FD" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Where it hits first</text>
  <text x="1130" y="360" fill="white" font-family="Inter, Arial, sans-serif" font-size="24">• Customer support</text>
  <text x="1130" y="405" fill="white" font-family="Inter, Arial, sans-serif" font-size="24">• Claims and case handling</text>
  <text x="1130" y="450" fill="white" font-family="Inter, Arial, sans-serif" font-size="24">• Onboarding and KYC</text>
  <text x="1130" y="495" fill="white" font-family="Inter, Arial, sans-serif" font-size="24">• IT helpdesk</text>
  <text x="1130" y="540" fill="white" font-family="Inter, Arial, sans-serif" font-size="24">• Sales ops / RevOps</text>
  <text x="1130" y="585" fill="white" font-family="Inter, Arial, sans-serif" font-size="24">• Scheduling and logistics</text>
  <text x="1130" y="630" fill="white" font-family="Inter, Arial, sans-serif" font-size="24">• Healthcare admin</text>
  <text x="1130" y="675" fill="#F9A8D4" font-family="Inter, Arial, sans-serif" font-size="22">Anywhere work is policy + systems + repetition</text>

  <path d="M515 480C545 480 555 480 575 480" stroke="url(#blue)" stroke-width="10" stroke-linecap="round"/>
  <path d="M1015 480C1045 480 1055 480 1075 480" stroke="url(#purple)" stroke-width="10" stroke-linecap="round"/>

  <text x="90" y="820" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="24">The disruption is not “better answers.” It is autonomous workflow execution with real permissions.</text>
</svg>