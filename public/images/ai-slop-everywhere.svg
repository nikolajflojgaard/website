<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI slop is flooding the internet</title>
  <desc id="desc">A clean editorial illustration showing social feeds, video tiles, and synthetic content multiplying faster than human attention can process it.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151A2F"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="noise" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="90" y="112" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700">AI slop is everywhere now</text>
  <text x="90" y="160" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="28">Social feeds, YouTube, search results, comments, thumbnails, voice clones, fake expertise.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="230" width="480" height="520" rx="28" fill="#0F172A" stroke="#1E293B"/>
    <text x="128" y="290" fill="#7DD3FC" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Human signal</text>
    <rect x="128" y="330" width="404" height="88" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="128" y="442" width="404" height="88" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="128" y="554" width="404" height="88" rx="18" fill="#111827" stroke="#334155"/>
    <circle cx="174" cy="374" r="20" fill="url(#signal)"/>
    <circle cx="174" cy="486" r="20" fill="url(#signal)"/>
    <circle cx="174" cy="598" r="20" fill="url(#signal)"/>
    <rect x="214" y="354" width="210" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="214" y="378" width="286" height="10" rx="5" fill="#64748B"/>
    <rect x="214" y="466" width="180" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="214" y="490" width="270" height="10" rx="5" fill="#64748B"/>
    <rect x="214" y="578" width="236" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="214" y="602" width="248" height="10" rx="5" fill="#64748B"/>
    <text x="128" y="705" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="22">slower, rarer, worth noticing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="230" width="890" height="520" rx="28" fill="#111827" stroke="#1E293B"/>
    <text x="660" y="290" fill="#FDBA74" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Synthetic flood</text>

    <rect x="660" y="330" width="230" height="122" rx="20" fill="#1F2937" stroke="#374151"/>
    <rect x="910" y="330" width="230" height="122" rx="20" fill="#1F2937" stroke="#374151"/>
    <rect x="1160" y="330" width="230" height="122" rx="20" fill="#1F2937" stroke="#374151"/>
    <rect x="660" y="476" width="230" height="122" rx="20" fill="#1F2937" stroke="#374151"/>
    <rect x="910" y="476" width="230" height="122" rx="20" fill="#1F2937" stroke="#374151"/>
    <rect x="1160" y="476" width="230" height="122" rx="20" fill="#1F2937" stroke="#374151"/>

    <polygon points="710,370 748,394 710,418" fill="url(#noise)"/>
    <polygon points="960,370 998,394 960,418" fill="url(#noise)"/>
    <polygon points="1210,370 1248,394 1210,418" fill="url(#noise)"/>
    <rect x="694" y="432" width="128" height="10" rx="5" fill="#94A3B8"/>
    <rect x="944" y="432" width="128" height="10" rx="5" fill="#94A3B8"/>
    <rect x="1194" y="432" width="128" height="10" rx="5" fill="#94A3B8"/>

    <circle cx="716" cy="537" r="18" fill="url(#noise)"/>
    <circle cx="966" cy="537" r="18" fill="url(#noise)"/>
    <circle cx="1216" cy="537" r="18" fill="url(#noise)"/>
    <rect x="750" y="524" width="98" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="1000" y="524" width="98" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="1250" y="524" width="98" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="750" y="546" width="116" height="8" rx="4" fill="#64748B"/>
    <rect x="1000" y="546" width="116" height="8" rx="4" fill="#64748B"/>
    <rect x="1250" y="546" width="116" height="8" rx="4" fill="#64748B"/>

    <path d="M818 640 C860 614,906 614,948 640" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 16"/>
    <path d="M1068 640 C1110 614,1156 614,1198 640" stroke="#EF4444" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 16"/>
    <text x="660" y="705" fill="#FCA5A5" font-family="Inter, Arial, sans-serif" font-size="22">cheap to make, endless to multiply, exhausting to filter</text>
  </g>

  <text x="90" y="830" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="24">The problem is no longer whether AI can create content. It is whether humans can still find anything worth their attention.</text>
</svg>
