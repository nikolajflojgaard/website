<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal Agent Ops Kit</title>
  <desc id="desc">A diagram showing the operational loop around a personal AI agent: signal, context, agent, action, memory, handoff, and cleanup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="110" y="95" width="1380" height="710" rx="34" fill="#ffffff" filter="url(#shadow)"/>

  <text x="160" y="175" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800">Personal Agent Ops Kit</text>
  <text x="164" y="225" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">The unglamorous machinery that makes a personal agent useful after the demo ends.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(185 320)">
      <rect width="270" height="130" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
      <text x="30" y="52" fill="#1e3a8a" font-size="26" font-weight="800">Signal</text>
      <text x="30" y="88" fill="#334155" font-size="20">cron, messages, errors</text>
    </g>

    <g transform="translate(515 320)">
      <rect width="270" height="130" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
      <text x="30" y="52" fill="#14532d" font-size="26" font-weight="800">Context</text>
      <text x="30" y="88" fill="#334155" font-size="20">memory, files, state</text>
    </g>

    <g transform="translate(845 320)">
      <rect width="270" height="130" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
      <text x="30" y="52" fill="#7c2d12" font-size="26" font-weight="800">Agent</text>
      <text x="30" y="88" fill="#334155" font-size="20">reason, edit, verify</text>
    </g>

    <g transform="translate(1175 320)">
      <rect width="270" height="130" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
      <text x="30" y="52" fill="#4c1d95" font-size="26" font-weight="800">Action</text>
      <text x="30" y="88" fill="#334155" font-size="20">ship, alert, recover</text>
    </g>

    <path d="M455 385h60" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M785 385h60" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M1115 385h60" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(250 560)">
      <rect width="300" height="112" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text x="26" y="48" fill="#0f172a" font-size="24" font-weight="800">OAuth recovery</text>
      <text x="26" y="80" fill="#475569" font-size="19">start, wait, verify</text>
    </g>

    <g transform="translate(650 560)">
      <rect width="300" height="112" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text x="26" y="48" fill="#0f172a" font-size="24" font-weight="800">Context handoff</text>
      <text x="26" y="80" fill="#475569" font-size="19">resume before drift</text>
    </g>

    <g transform="translate(1050 560)">
      <rect width="300" height="112" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text x="26" y="48" fill="#0f172a" font-size="24" font-weight="800">Subagent cleanup</text>
      <text x="26" y="80" fill="#475569" font-size="19">delegate, collect, close</text>
    </g>

    <path d="M400 560c40-58 102-88 185-88h430c80 0 145 30 194 88" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 18"/>
    <path d="M1190 672c-85 60-188 90-310 90H714c-126 0-233-30-322-90" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 18"/>
  </g>
</svg>
