name: GitHub Data Sync

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: github-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Sync GitHub data
        env:
          GITHUB_USERNAME: nikolajflojgaard
          # Use GITHUB_TOKEN for public repos only
          # For private repos, create a Personal Access Token with 'repo' scope
          # and store it as GH_PRIVATE_TOKEN secret, then update below
          GITHUB_TOKEN: ${{ secrets.GH_PRIVATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/github_sync.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub data [automated]"
            git push
          fi
