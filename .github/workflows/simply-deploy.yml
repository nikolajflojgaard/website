name: Deploy to Simply (FTPS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/content/blog/**"
      - "data/linkedin_state.json"

concurrency:
  group: simply-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload dist/ to Simply over FTPS
        env:
          HOST: ${{ secrets.SIMPLY_SFTP_HOST }}
          USER: ${{ secrets.SIMPLY_SFTP_USER }}
          PASS: ${{ secrets.SIMPLY_SFTP_PASS }}
          PORT: ${{ secrets.SIMPLY_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.SIMPLY_REMOTE_DIR }}
        run: |
          lftp -e "
            set ftp:passive-mode true;
            set ftp:ssl-allow yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -u $USER,$PASS ftp://$HOST:$PORT;
            mirror -R --delete --verbose dist/ $REMOTE_DIR;
            bye
          "
