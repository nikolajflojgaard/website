name: Deploy to Simply (FTPS)

on:
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Full deploy: re-upload ALL files (ignore incremental size check)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
      - "CHANGELOG.md"
      - ".github/workflows/linkedin-sync.yml"
      - "linkedin-sync.yml"

concurrency:
  group: simply-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp

      - name: Upload dist/ to Simply over FTPS
        env:
          HOST: ${{ secrets.SIMPLY_SFTP_HOST }}
          USER: ${{ secrets.SIMPLY_SFTP_USER }}
          PASS: ${{ secrets.SIMPLY_SFTP_PASS }}
          PORT: ${{ secrets.SIMPLY_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.SIMPLY_REMOTE_DIR }}
          FULL_DEPLOY: ${{ inputs.full_deploy && 'true' || 'false' }}
        run: |
          # Pass 1: assets, only uploaded when size differs (always-files excluded, nothing deleted yet)
          # Pass 2 (--transfer-all): always re-upload HTML, dotfiles/.htaccess, txt/json/xml/webmanifest, favicons, service worker, manifest, sitemaps, robots, feeds, pagefind entry files
          # Pass 3: --delete removes files no longer in dist/ (no re-upload, sizes already match)
          set -f  # don't let the shell expand the globs below
          PATTERNS=".* *.html *.txt *.json *.webmanifest *.xml *.md sw.js workbox-*.js registerSW.js favicon* apple-touch-icon.png pagefind.js pagefind-ui.js pagefind-ui.css pagefind-highlight.js pagefind-modular-ui.js pagefind-modular-ui.css *.pf_meta"
          ALWAYS_EXCLUDE=""; ALWAYS_INCLUDE=""
          for p in $PATTERNS; do
            ALWAYS_EXCLUDE="$ALWAYS_EXCLUDE --exclude-glob=$p"
            ALWAYS_INCLUDE="$ALWAYS_INCLUDE --include-glob=$p"
          done
          if [ "$FULL_DEPLOY" = "true" ]; then
            echo "Full deploy: re-uploading all files"
            MIRROR_CMDS="mirror -R --delete --overwrite --transfer-all --parallel=4 --no-perms dist/ $REMOTE_DIR;"
          else
            MIRROR_CMDS="mirror -R --only-newer --ignore-time --parallel=4 --no-perms $ALWAYS_EXCLUDE dist/ $REMOTE_DIR;
            mirror -R --transfer-all --parallel=4 --no-perms $ALWAYS_INCLUDE dist/ $REMOTE_DIR;
            mirror -R --delete --only-newer --ignore-time --parallel=4 --no-perms dist/ $REMOTE_DIR;"
          fi
          lftp -e "
            set ftp:passive-mode true;
            set ftp:ssl-allow yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set xfer:make-backup false;
            open -u $USER,$PASS ftp://$HOST:$PORT;
            mkdir -p $REMOTE_DIR;
            $MIRROR_CMDS
            bye
          "
