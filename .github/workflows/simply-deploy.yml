name: Deploy to Simply (FTPS)

on:
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Full deploy: re-upload ALL files (ignore content-hash manifest)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
      - "CHANGELOG.md"
      - ".github/workflows/linkedin-sync.yml"
      - "linkedin-sync.yml"

concurrency:
  group: simply-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp

      - name: Upload dist/ over certificate-verified FTPS (preserve remote-only files)
        env:
          HOST: ${{ secrets.SIMPLY_SFTP_HOST }}
          FTP_USER: ${{ secrets.SIMPLY_SFTP_USER }}
          PASS: ${{ secrets.SIMPLY_SFTP_PASS }}
          PORT: ${{ secrets.SIMPLY_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.SIMPLY_REMOTE_DIR }}
          FULL_DEPLOY: ${{ inputs.full_deploy && 'true' || 'false' }}
        run: bash scripts/simply-hash-deploy.sh
