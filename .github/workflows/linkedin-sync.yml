name: LinkedIn Sync

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules are in UTC.
    # Run twice so it lands on 12:00 in Europe/Copenhagen across DST.
    - cron: "0 10,11 * * *"

permissions:
  contents: write

concurrency:
  group: linkedin-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Decide if we should run (12:00 Europe/Copenhagen)
        run: |
          hour="$(TZ=Europe/Copenhagen date +%H)"
          should_run=false
          if [ "$hour" = "12" ]; then
            should_run=true
          fi
          echo "Europe/Copenhagen hour: $hour shouldRun: $should_run"
          echo "SHOULD_RUN=$should_run" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == 'true'

      - name: Set up Node.js
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: npm ci

      - name: Sync LinkedIn posts into content
        if: env.SHOULD_RUN == 'true'
        run: node scripts/linkedin_sync.mjs

      - name: Commit changes (if any)
        if: env.SHOULD_RUN == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync LinkedIn posts"
          git push
